<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <button class="theme-toggle" id="theme-toggle">
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
        <header class="heading">
            <h1 class="title">Tic-Tac-Toe</h1>
        </header>
        <main class="main">
            <div class="settings">
                <div class="difficulty">
                    <button class="difficulty-button">Easy</button>
                    <button class="difficulty-button">Hard</button>
                    <button class="difficulty-button">Impossible</button>
                </div>
                <div class="symbol">
                    <button class="symbol-button">X</button>
                    <button class="symbol-button">O</button>
                </div>
            </div>
            <div class="results">
                <div class="result">
                    <span class="result-title">WIN</span>
                    <span class="result-value" id="result-win">0</span>
                </div>
                <div class="result">
                    <span class="result-title">DRAW</span>
                    <span class="result-value" id="result-draw">0</span>
                </div>
                <div class="result">
                    <span class="result-title">LOSS</span>
                    <span class="result-value" id="result-lose">0</span>
                </div>
            </div>
            <div class="status">
                <p>[SAMPLE] CPU is thinking...</p>
            </div>
            <div class="board">
                <!-- BOARD GOES HERE -->
            </div>
            <div class="restart">
                <button class="restart-button">New Game</button>
            </div>
        </main>
    </div>
</body>
</html>
